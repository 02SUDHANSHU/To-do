<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px}
    .bar{display:flex;gap:8px}
    input[type=text]{flex:1;padding:8px}
    li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #ddd}
    li.done span{text-decoration:line-through;color:#888}
    li span{flex:1}
    #info{font-size:12px;color:#666;margin-top:24px}
  </style>
</head>
<body>
  <h1>To-Do</h1>
  <div class="bar">
    <input id="title" type="text" placeholder="New task">
    <button onclick="addTask()">Add</button>
  </div>
  <ul id="list" style="list-style:none;padding:0"></ul>
  <div id="info"></div>
<script>
async function api(url, method="GET", body){
  for (let i=0;i<3;i++){               // client-side retry for failover blips
    try{
      const r = await fetch(url,{method,headers:{"Content-Type":"application/json"},
        body: body?JSON.stringify(body):undefined});
      if(r.ok) return r.json();
    }catch(e){}
    await new Promise(r=>setTimeout(r,1000*(i+1)));
  }
  alert("Service temporarily unavailable"); throw new Error("failed");
}
async function load(){
  const tasks = await api("/api/tasks");
  const list = document.getElementById("list"); list.innerHTML="";
  tasks.forEach(t=>{
    const li=document.createElement("li"); if(t.completed) li.className="done";
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!t.completed;
    cb.onchange=()=>api("/api/tasks/"+t.id,"PUT",{completed:cb.checked}).then(load);
    const sp=document.createElement("span"); sp.textContent=t.title;
    const ed=document.createElement("button"); ed.textContent="Edit";
    ed.onclick=()=>{const n=prompt("Edit task",t.title); if(n) api("/api/tasks/"+t.id,"PUT",{title:n}).then(load);};
    const de=document.createElement("button"); de.textContent="Delete";
    de.onclick=()=>api("/api/tasks/"+t.id,"DELETE").then(load);
    li.append(cb,sp,ed,de); list.appendChild(li);
  });
  const i = await api("/api/info");
  document.getElementById("info").textContent = "Served by "+i.instance_id+" in "+i.az;
}
async function addTask(){
  const el=document.getElementById("title"); if(!el.value.trim()) return;
  await api("/api/tasks","POST",{title:el.value}); el.value=""; load();
}
load();
</script>
</body>
</html>
